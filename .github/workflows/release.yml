name: Create Release

on:
  workflow_dispatch:
    inputs:
      release-ver:
        description: Release version
        required: true
        default: v1.0.0
      mod-ver:
        description: Mod version
        required: true
        type: choice
        options: ["1.6.x", "1.7.x", "1.8.x"]

env:
  PLUGIN_NAME: LotusPortraitVanillafied

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Create Release Zip
      run: |
        quests="user/mods/Lotus/db/CustomQuests/6747208ef022cbbfc65c41bf/Images"
        case "${{ inputs.mod-ver }}" in
          1.6.x)
            portrait="user/mods/Lunnayaluna Lotus/res/lotus.png"
            quest="user/mods/Virtual's Custom Quest Loader/res/quests/lotus_trader_lotus.png" ;;
          1.7.x)
            portrait="SPT/user/mods/Lotus/res/Lotus.jpg"
            quest="SPT/$quests/lotus_trader_lotus.png" ;;
          1.8.x)
            portrait="SPT_Runtime/user/mods/Lotus/res/Lotus.jpg"
            quest="SPT_Runtime/$quests/lotus_trader_lotus.png" ;;
        esac
        put() { mkdir -p "release/$(dirname "$2")" && cp "$1" "release/$2"; }
        put lotus.jpg "$portrait"
        put quest.png "$quest"
        (cd release && zip -r "../${{ env.PLUGIN_NAME }}-Lotus${{ inputs.mod-ver }}-${{ inputs.release-ver }}.zip" .)

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ inputs.release-ver }}
        name: ${{ inputs.release-ver }}
        files: ${{ env.PLUGIN_NAME }}-Lotus${{ inputs.mod-ver }}-${{ inputs.release-ver }}.zip
        draft: false
        prerelease: false
        make_latest: true
